<nav class="nav">
  <div class="nav__inner">
    <a href="{{ '/' | relative_url }}" class="nav__brand">
      <span class="nav__brand-icon">🌍</span>
      {{ site.title }}
    </a>
    <div class="nav__links">
      {% for cat in site.data.categories %}
        <a href="{{ '/category/' | append: cat.slug | relative_url }}/">{{ cat.name }}</a>
      {% endfor %}
      <a href="{{ '/pages/search/' | relative_url }}" class="nav__search-btn">🔍 搜索</a>
    </div>
  </div>
</nav>
