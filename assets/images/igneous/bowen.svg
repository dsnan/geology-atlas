<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#1a0a08"/>
  <g transform="translate(200,20)" opacity="0.8">
    <!-- Title -->
    <text x="0" y="20" text-anchor="middle" fill="#f0c040" font-size="12" font-family="sans-serif" font-weight="bold">鲍温反应序列</text>
    <!-- Discontinuous series -->
    <rect x="-80" y="35" width="70" height="22" rx="3" fill="#8B4513" opacity="0.6"/><text x="-45" y="50" text-anchor="middle" fill="#fff" font-size="9">橄榄石</text>
    <rect x="-70" y="62" width="60" height="20" rx="3" fill="#6B3513" opacity="0.6"/><text x="-40" y="76" text-anchor="middle" fill="#ddd" font-size="9">辉石</text>
    <rect x="-62" y="87" width="55" height="18" rx="3" fill="#5B2503" opacity="0.6"/><text x="-35" y="100" text-anchor="middle" fill="#ddd" font-size="9">角闪石</text>
    <rect x="-55" y="110" width="50" height="16" rx="3" fill="#4B1503" opacity="0.6"/><text x="-30" y="121" text-anchor="middle" fill="#ddd" font-size="9">黑云母</text>
    <!-- Arrow down left -->
    <line x1="-35" y1="57" x2="-35" y2="155" stroke="#C0392B" stroke-width="1.5" opacity="0.6"/>
    <polygon points="-35,160 -40,152 -30,152" fill="#C0392B" opacity="0.6"/>
    <!-- Continuous series -->
    <rect x="20" y="35" width="70" height="22" rx="3" fill="#4A6a9a" opacity="0.6"/><text x="55" y="50" text-anchor="middle" fill="#fff" font-size="9">钙长石</text>
    <rect x="25" y="62" width="65" height="20" rx="3" fill="#5A7aaa" opacity="0.6"/><text x="57" y="76" text-anchor="middle" fill="#ddd" font-size="9">培长石</text>
    <rect x="28" y="87" width="62" height="18" rx="3" fill="#6A8aba" opacity="0.6"/><text x="59" y="100" text-anchor="middle" fill="#ddd" font-size="9">拉长石</text>
    <rect x="30" y="110" width="58" height="16" rx="3" fill="#7A9aca" opacity="0.6"/><text x="59" y="121" text-anchor="middle" fill="#ddd" font-size="9">中长石</text>
    <rect x="32" y="131" width="55" height="15" rx="3" fill="#8AAada" opacity="0.6"/><text x="59" y="141" text-anchor="middle" fill="#ddd" font-size="8">更长石</text>
    <rect x="35" y="150" width="52" height="14" rx="3" fill="#9ABAea" opacity="0.6"/><text x="61" y="159" text-anchor="middle" fill="#1a1a2e" font-size="8">钠长石</text>
    <!-- Arrow down right -->
    <line x1="60" y1="57" x2="60" y2="175" stroke="#4A90D9" stroke-width="1.5" opacity="0.6"/>
    <polygon points="60,180 55,172 65,172" fill="#4A90D9" opacity="0.6"/>
    <!-- Final minerals -->
    <rect x="-45" y="175" width="50" height="18" rx="3" fill="#B0A090" opacity="0.6"/><text x="-20" y="188" text-anchor="middle" fill="#1a1a2e" font-size="8">钾长石</text>
    <rect x="10" y="175" width="50" height="18" rx="3" fill="#B0A090" opacity="0.6"/><text x="35" y="188" text-anchor="middle" fill="#1a1a2e" font-size="8">白云母</text>
    <rect x="-15" y="198" width="80" height="18" rx="3" fill="#D0C8B8" opacity="0.6"/><text x="25" y="211" text-anchor="middle" fill="#1a1a2e" font-size="8">石英</text>
    <!-- Temperature labels -->
    <text x="-90" y="45" fill="#C0392B" font-size="7" opacity="0.7">高温</text>
    <text x="-90" y="200" fill="#4A90D9" font-size="7" opacity="0.7">低温</text>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#ddd" font-size="13" font-family="sans-serif" opacity="0.7">鲍温反应序列 | Bowen's Reaction Series</text>
</svg>
